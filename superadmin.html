<!DOCTYPE html>
<html lang="sv">
<head>
<link rel="icon" type="image/png" href="PM_logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperAdmin – PreMeny</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--surface:#fff;--surface2:#f5f0e8;--border:#e8e2d8;--gold:#b8955a;--dark:#1a1712;--text:#2d2a24;--muted:#8a8070;--red:#c0392b;--green:#3a7d44}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit",sans-serif;font-weight:300;min-height:100vh;font-size:15px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(250,248,244,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.logo{font-family:"Playfair Display",serif;font-size:1.15rem;font-style:italic;color:var(--dark)}.logo span{color:var(--gold)}
.sa-badge{background:rgba(184,149,90,.12);border:1px solid rgba(184,149,90,.3);border-radius:100px;padding:2px 10px;font-size:11px;color:var(--gold);font-weight:500;letter-spacing:.05em}
.page{max-width:900px;margin:0 auto;padding:2rem 1.25rem 5rem}
h1{font-family:"Playfair Display",serif;font-size:1.9rem;font-weight:400;color:var(--dark);margin-bottom:.25rem}
h3{font-family:"Playfair Display",serif;font-size:1.15rem;font-weight:400;color:var(--dark)}
.gold-line{width:32px;height:1px;background:var(--gold);margin:.5rem 0 1.25rem;opacity:.7}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:.75rem}
.card-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:"Outfit",sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;resize:none;font-weight:300}
input:focus,textarea:focus,select:focus{border-color:var(--gold);background:var(--surface)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ff{margin-bottom:.75rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:100px;font-family:"Outfit",sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:1px solid transparent;white-space:nowrap}
.bp{background:var(--dark);color:#fff}.bp:hover{background:#2d2820}
.bg{background:transparent;border-color:var(--border);color:var(--muted)}.bg:hover{border-color:var(--dark);color:var(--dark)}
.bd{background:transparent;border-color:#e8d0d0;color:#a05050}.bd:hover{border-color:var(--red);color:var(--red)}
.bfull{width:100%;justify-content:center;padding:13px}
.msg{padding:11px 16px;border-radius:8px;font-size:13px;margin:.75rem 0;border:1px solid}
.mok{background:#f2f8ec;color:#3a6020;border-color:#c8e0a8}
.merr{background:#fdf2f2;color:#8a2020;border-color:#e8c0c0}
.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-top:1rem}
.rest-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:border-color .2s}
.rest-card:hover{border-color:var(--gold)}
.rest-name{font-family:"Playfair Display",serif;font-size:1.1rem;color:var(--dark);margin-bottom:.25rem}
.rest-slug{font-size:12px;color:var(--muted);font-family:monospace;margin-bottom:.75rem}
.rest-info{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:.75rem}
.plan-badge{border-radius:100px;padding:3px 10px;font-size:11px;font-weight:500}
.plan-early{background:rgba(184,149,90,.1);border:1px solid rgba(184,149,90,.25);color:var(--gold)}
.plan-small{background:#eef6e8;border:1px solid #c8e0a8;color:#3a6020}
.plan-medium{background:#e8f0fc;border:1px solid #b8d0f8;color:#1a4090}
.plan-large{background:#f0e8fc;border:1px solid #d0b8f8;color:#5a1a90}
.active-dot{width:8px;height:8px;border-radius:50%;background:#3a7d44;display:inline-block;margin-right:5px}
.inactive-dot{width:8px;height:8px;border-radius:50%;background:#c0392b;display:inline-block;margin-right:5px}
.login-wrap{max-width:380px;margin:4rem auto;padding:2.5rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;text-align:center;box-shadow:0 4px 32px rgba(0,0,0,.06)}
.spinner{width:14px;height:14px;border:2px solid rgba(184,149,90,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;text-align:center}
.stat-n{font-family:"Playfair Display",serif;font-size:2.2rem;color:var(--dark);font-weight:400}
.stat-l{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
.modal-overlay{position:fixed;inset:0;background:rgba(26,23,18,.5);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.75rem;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 48px rgba(0,0,0,.12)}
@media(max-width:600px){.r2,.r3{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr 1fr}.page{padding:1.5rem 1rem 4rem}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-wrap">
    <div style="font-family:'Playfair Display',serif;font-size:2.2rem;font-style:italic;color:var(--dark);margin-bottom:.25rem">Pre<span style="color:var(--gold)">Meny</span></div>
    <div class="sa-badge" style="display:inline-block;margin:.25rem 0 1.25rem">SuperAdmin</div>
    <div id="loginMsg" style="display:none" class="msg merr"></div>
    <div class="ff"><label>E-post</label><input type="email" id="loginEmail" placeholder="superadmin@premeny.se" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="ff"><label>Lösenord</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn bp bfull" style="padding:13px" onclick="doLogin()">Logga in</button>
  </div>
</div>

<!-- SUPERADMIN -->
<div id="adminPage" style="display:none">
  <nav class="nav">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo">Pre<span>Meny</span></div>
      <div class="sa-badge">SuperAdmin</div>
    </div>
    <button class="btn bg" style="padding:6px 14px;font-size:12px" onclick="doLogout()">Logga ut</button>
  </nav>

  <div class="page">
    <h1>Översikt</h1>
    <div class="gold-line"></div>

    <!-- STATISTIK -->
    <div class="stat-row" id="statRow">
      <div class="stat"><div class="spinner"></div></div>
    </div>

    <!-- NY RESTAURANG -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
      <h3>Restauranger</h3>
      <button class="btn bp" onclick="openNewRest()">+ Lägg till restaurang</button>
    </div>

    <div id="restGrid" class="rest-grid"></div>
  </div>
</div>

<!-- NY RESTAURANG MODAL -->
<div id="newRestModal" class="modal-overlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <h3>Lägg till ny restaurang</h3>
      <button class="btn bg" style="padding:5px 12px;font-size:12px" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="card-label">Grundinfo</div>
    <div class="r2">
      <div class="ff"><label>Restaurangens namn *</label><input type="text" id="nr-name" placeholder="T.ex. Brunsbo Gästgiveri"></div>
      <div class="ff"><label>Slug (URL-namn) *</label><input type="text" id="nr-slug" placeholder="brunsbo" oninput="autoSlug(false)"></div>
    </div>
    <div class="r2">
      <div class="ff"><label>Plan</label>
        <select id="nr-plan">
          <option value="early_bird">Early Bird – 299 kr/mån</option>
          <option value="small">Small – 499 kr/mån</option>
          <option value="medium">Medium – 799 kr/mån</option>
          <option value="large">Large – 1199 kr/mån</option>
        </select>
      </div>
      <div class="ff"><label>Accentfärg</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="color" id="nr-color" value="#b8955a" style="width:44px;height:38px;padding:2px;border-radius:6px;cursor:pointer;flex-shrink:0">
          <input type="text" id="nr-color-text" value="#b8955a" style="font-family:monospace;font-size:13px" oninput="document.getElementById('nr-color').value=this.value">
        </div>
      </div>
    </div>
    <div class="card-label" style="margin-top:.5rem">Kontaktuppgifter</div>
    <div class="r2">
      <div class="ff"><label>Telefon</label><input type="tel" id="nr-phone" placeholder="+46 35 123 45 67"></div>
      <div class="ff"><label>E-post</label><input type="email" id="nr-email" placeholder="info@restaurangen.se"></div>
    </div>
    <div class="r2">
      <div class="ff"><label>Adress</label><input type="text" id="nr-address" placeholder="Storgatan 1, 123 45 Stad"></div>
      <div class="ff"><label>Webbplats</label><input type="text" id="nr-website" placeholder="www.restaurangen.se"></div>
    </div>
    <div class="card-label" style="margin-top:.5rem">Adminkonto</div>
    <div class="r2">
      <div class="ff"><label>Admin e-post *</label><input type="email" id="nr-admin-email" placeholder="personal@restaurangen.se"></div>
      <div class="ff"><label>Temporärt lösenord *</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="nr-admin-pass" placeholder="Minst 8 tecken">
          <button class="btn bg" style="padding:8px 12px;flex-shrink:0;font-size:12px" onclick="genPass()">Generera</button>
        </div>
      </div>
    </div>
    <div style="background:rgba(184,149,90,.07);border:1px solid rgba(184,149,90,.2);border-radius:8px;padding:.75rem 1rem;font-size:13px;color:#6a5030;line-height:1.6;margin-bottom:1rem">
      ℹ Adminens e-post och lösenord skapas i Supabase Auth. Skicka sedan inloggningsuppgifterna manuellt till restaurangen.
    </div>
    <div id="nr-msg" style="display:none" class="msg"></div>
    <div style="display:flex;gap:8px">
      <button class="btn bp" onclick="createRestaurant()" id="nr-btn">Skapa restaurang</button>
      <button class="btn bg" onclick="closeModalDirect()">Avbryt</button>
    </div>
  </div>
</div>

<!-- EDIT RESTAURANG MODAL -->
<div id="editRestModal" class="modal-overlay" style="display:none" onclick="closeEditModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">
      <h3>Redigera restaurang</h3>
      <button class="btn bg" style="padding:5px 12px;font-size:12px" onclick="closeEditModalDirect()">✕</button>
    </div>
    <div id="editRestContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SURL='https://gndzalmkbsfhclpoidqi.supabase.co';
const SKEY='sb_publishable_-k5es8L7H2z0K7ipe13meA_IQxopBtY';
const {createClient}=supabase;
const db=createClient(SURL,SKEY);

// SuperAdmin email – change this to your own
const SUPERADMIN_EMAIL='superadmin@premeny.se';

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const {error}=await db.auth.signInWithPassword({email,password:pass});
  if(error){const m=document.getElementById('loginMsg');m.style.display='block';m.textContent='Fel e-post eller lösenord.';return;}
  // Verify superadmin
  const {data:{user}}=await db.auth.getUser();
  if(user.email!==SUPERADMIN_EMAIL){
    await db.auth.signOut();
    const m=document.getElementById('loginMsg');m.style.display='block';m.textContent='Du har inte behörighet till superadmin.';return;
  }
  initAdmin();
}
async function doLogout(){await db.auth.signOut();location.reload();}

async function initAdmin(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  loadStats();
  loadRestaurants();
}

async function loadStats(){
  const {data:rests}=await db.from('restaurants').select('id,active,plan');
  const {data:bookings}=await db.from('bookings').select('id');
  const {data:orders}=await db.from('orders').select('id');
  const total=rests?.length||0;
  const active=(rests||[]).filter(r=>r.active).length;
  document.getElementById('statRow').innerHTML=`
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">Restauranger</div></div>
    <div class="stat"><div class="stat-n">${active}</div><div class="stat-l">Aktiva</div></div>
    <div class="stat"><div class="stat-n">${bookings?.length||0}</div><div class="stat-l">Bokningar totalt</div></div>
    <div class="stat"><div class="stat-n">${orders?.length||0}</div><div class="stat-l">Beställningar totalt</div></div>`;
}

async function loadRestaurants(){
  const {data:rests}=await db.from('restaurants').select('*').order('created_at',{ascending:false});
  const grid=document.getElementById('restGrid');
  if(!rests?.length){grid.innerHTML='<div style="color:var(--muted);font-size:14px;padding:1rem">Inga restauranger ännu.</div>';return;}

  const planLabels={early_bird:'Early Bird',small:'Small',medium:'Medium',large:'Large'};
  const planClass={early_bird:'plan-early',small:'plan-small',medium:'plan-medium',large:'plan-large'};

  grid.innerHTML=rests.map(r=>`
    <div class="rest-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem">
        <div>
          <div style="width:12px;height:12px;border-radius:50%;background:${r.accent_color||'#b8955a'};display:inline-block;margin-right:6px;vertical-align:middle"></div>
          <span class="rest-name" style="vertical-align:middle">${r.name}</span>
        </div>
        <span class="${r.active?'active-dot':'inactive-dot'}"></span>
      </div>
      <div class="rest-slug">premeny.se/${r.slug}</div>
      <div class="rest-info">
        ${r.phone?'📞 '+r.phone+'<br>':''}
        ${r.contact_email?'✉ '+r.contact_email+'<br>':''}
        ${r.address?'📍 '+r.address+'<br>':''}
        Skapad: ${new Date(r.created_at).toLocaleDateString('sv-SE')}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="plan-badge ${planClass[r.plan]||'plan-early'}">${planLabels[r.plan]||r.plan}</span>
        <button class="btn bg" style="font-size:11px;padding:4px 10px" onclick="openEditRest('${r.id}')">Redigera</button>
        <button class="btn bg" style="font-size:11px;padding:4px 10px" onclick="window.open('/landing.html?r=${r.slug}','_blank')">Landningssida</button>
        <button class="btn ${r.active?'bd':'bg'}" style="font-size:11px;padding:4px 10px" onclick="toggleActive('${r.id}',${r.active})">${r.active?'Inaktivera':'Aktivera'}</button>
      </div>
    </div>`).join('');
}

async function toggleActive(id,current){
  if(!confirm((current?'Inaktivera':'Aktivera')+' restaurangen?'))return;
  await db.from('restaurants').update({active:!current}).eq('id',id);
  loadRestaurants();loadStats();
}

// NY RESTAURANG
function openNewRest(){document.getElementById('newRestModal').style.display='flex';}
function closeModal(ev){if(ev.target===document.getElementById('newRestModal'))closeModalDirect();}
function closeModalDirect(){document.getElementById('newRestModal').style.display='none';}

function autoSlug(fromName){
  if(fromName){
    const name=document.getElementById('nr-name').value;
    const slug=name.toLowerCase().replace(/[åä]/g,'a').replace(/ö/g,'o').replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    document.getElementById('nr-slug').value=slug;
  }
}

document.addEventListener('input',function(e){
  if(e.target.id==='nr-name')autoSlug(true);
  if(e.target.id==='nr-color')document.getElementById('nr-color-text').value=e.target.value;
});

function genPass(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#';
  let pass='';for(let i=0;i<12;i++)pass+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('nr-admin-pass').value=pass;
}

async function createRestaurant(){
  const name=document.getElementById('nr-name').value.trim();
  const slug=document.getElementById('nr-slug').value.trim().toLowerCase();
  const adminEmail=document.getElementById('nr-admin-email').value.trim();
  const adminPass=document.getElementById('nr-admin-pass').value;
  const msgEl=document.getElementById('nr-msg');

  if(!name||!slug||!adminEmail||!adminPass){
    msgEl.style.display='block';msgEl.className='msg merr';msgEl.textContent='Fyll i alla obligatoriska fält (markerade med *).';return;
  }
  if(adminPass.length<8){
    msgEl.style.display='block';msgEl.className='msg merr';msgEl.textContent='Lösenordet måste vara minst 8 tecken.';return;
  }

  const btn=document.getElementById('nr-btn');
  btn.disabled=true;btn.textContent='Skapar...';
  msgEl.style.display='none';

  try{
    // 1. Skapa restaurang
    const {data:rest,error:e1}=await db.from('restaurants').insert({
      name,slug,
      accent_color:document.getElementById('nr-color').value,
      plan:document.getElementById('nr-plan').value,
      phone:document.getElementById('nr-phone').value.trim()||null,
      contact_email:document.getElementById('nr-email').value.trim()||null,
      address:document.getElementById('nr-address').value.trim()||null,
      website:document.getElementById('nr-website').value.trim()||null,
      active:true
    }).select().single();
    if(e1)throw new Error('Kunde inte skapa restaurang: '+e1.message);

    // 2. Skapa adminkonto via Supabase Admin API
    // OBS: Detta kräver service_role key – görs manuellt eller via backend
    // För nu – visa instruktioner
    msgEl.style.display='block';
    msgEl.className='msg mok';
    msgEl.innerHTML=`✓ <strong>${name}</strong> skapades!<br><br>
    Skapa adminkonto manuellt i Supabase:<br>
    <code style="background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-size:12px">Authentication → Users → Add user</code><br>
    E-post: <strong>${adminEmail}</strong><br>
    Lösenord: <strong>${adminPass}</strong><br><br>
    Kör sedan i SQL Editor:<br>
    <code style="background:rgba(0,0,0,.06);padding:4px 8px;border-radius:4px;font-size:11px;display:block;margin-top:4px;word-break:break-all">
    INSERT INTO restaurant_admins (restaurant_id, user_id)<br>
    SELECT '${rest.id}', id FROM auth.users WHERE email = '${adminEmail}';
    </code>`;
    loadRestaurants();loadStats();
  }catch(err){
    msgEl.style.display='block';msgEl.className='msg merr';msgEl.textContent='Fel: '+err.message;
  }
  btn.disabled=false;btn.textContent='Skapa restaurang';
}

// REDIGERA RESTAURANG
async function openEditRest(id){
  const {data:r}=await db.from('restaurants').select('*').eq('id',id).single();
  if(!r)return;
  const planLabels={early_bird:'Early Bird – 299 kr/mån',small:'Small – 499 kr/mån',medium:'Medium – 799 kr/mån',large:'Large – 1199 kr/mån'};
  document.getElementById('editRestContent').innerHTML=`
    <div class="r2">
      <div class="ff"><label>Namn</label><input type="text" id="er-name" value="${r.name}"></div>
      <div class="ff"><label>Slug</label><input type="text" id="er-slug" value="${r.slug}"></div>
    </div>
    <div class="r2">
      <div class="ff"><label>Plan</label><select id="er-plan">
        ${Object.entries(planLabels).map(([v,l])=>`<option value="${v}"${r.plan===v?' selected':''}>${l}</option>`).join('')}
      </select></div>
      <div class="ff"><label>Accentfärg</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="er-color" value="${r.accent_color||'#b8955a'}" style="width:44px;height:38px;padding:2px;border-radius:6px;cursor:pointer"><input type="text" id="er-color-text" value="${r.accent_color||'#b8955a'}" style="font-family:monospace;font-size:13px" oninput="document.getElementById('er-color').value=this.value"></div></div>
    </div>
    <div class="r2">
      <div class="ff"><label>Telefon</label><input type="tel" id="er-phone" value="${r.phone||''}"></div>
      <div class="ff"><label>E-post</label><input type="email" id="er-email" value="${r.contact_email||''}"></div>
    </div>
    <div class="r2">
      <div class="ff"><label>Adress</label><input type="text" id="er-address" value="${r.address||''}"></div>
      <div class="ff"><label>Webbplats</label><input type="text" id="er-website" value="${r.website||''}"></div>
    </div>
    <div id="er-msg" style="display:none" class="msg"></div>
    <div style="display:flex;gap:8px">
      <button class="btn bp" onclick="saveEditRest('${id}')">Spara</button>
      <button class="btn bg" onclick="closeEditModalDirect()">Avbryt</button>
    </div>`;
  document.getElementById('er-color').addEventListener('input',function(){document.getElementById('er-color-text').value=this.value;});
  document.getElementById('editRestModal').style.display='flex';
}

async function saveEditRest(id){
  const {error}=await db.from('restaurants').update({
    name:document.getElementById('er-name').value.trim(),
    slug:document.getElementById('er-slug').value.trim().toLowerCase(),
    plan:document.getElementById('er-plan').value,
    accent_color:document.getElementById('er-color').value,
    phone:document.getElementById('er-phone').value.trim()||null,
    contact_email:document.getElementById('er-email').value.trim()||null,
    address:document.getElementById('er-address').value.trim()||null,
    website:document.getElementById('er-website').value.trim()||null,
  }).eq('id',id);
  const msg=document.getElementById('er-msg');
  if(error){msg.style.display='block';msg.className='msg merr';msg.textContent='Fel: '+error.message;return;}
  msg.style.display='block';msg.className='msg mok';msg.textContent='✓ Sparat!';
  setTimeout(()=>{closeEditModalDirect();loadRestaurants();},1000);
}

function closeEditModal(ev){if(ev.target===document.getElementById('editRestModal'))closeEditModalDirect();}
function closeEditModalDirect(){document.getElementById('editRestModal').style.display='none';}

// INIT
db.auth.getSession().then(({data:{session}})=>{
  if(session){
    if(session.user.email===SUPERADMIN_EMAIL)initAdmin();
    else{db.auth.signOut();}
  }
});
</script>
</body>
