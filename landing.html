<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Välkommen – PreMeny</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--surface:#fff;--border:#e8e2d8;--gold:#b8955a;--dark:#1a1712;--text:#2d2a24;--muted:#8a8070}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Outfit",sans-serif;font-weight:300;min-height:100vh}
.nav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.5rem;border-bottom:1px solid var(--border);background:rgba(250,248,244,.95);backdrop-filter:blur(12px)}
.logo{font-family:"Playfair Display",serif;font-size:1.1rem;font-style:italic;color:var(--dark)}.logo span{color:var(--gold)}
.hero{max-width:640px;margin:0 auto;padding:3rem 1.5rem 2rem;text-align:center}
.rest-logo{width:100px;height:100px;border-radius:50%;object-fit:contain;border:2px solid var(--border);margin:0 auto 1.5rem;display:block;background:var(--surface)}
.rest-logo-placeholder{width:100px;height:100px;border-radius:50%;background:rgba(184,149,90,.1);border:2px solid rgba(184,149,90,.3);margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:2rem;font-style:italic;color:var(--gold)}
h1{font-family:"Playfair Display",serif;font-size:2rem;font-weight:400;color:var(--dark);margin-bottom:.5rem}
.gold-line{width:32px;height:1px;background:var(--gold);margin:.75rem auto 1.25rem;opacity:.7}
.tagline{font-size:16px;color:var(--muted);line-height:1.7;margin-bottom:2rem;max-width:480px;margin-left:auto;margin-right:auto}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin:0 auto 1rem;max-width:480px;text-align:left}
.info-row{display:flex;align-items:center;gap:.75rem;padding:8px 0;border-bottom:1px solid var(--border);font-size:15px}
.info-row:last-child{border-bottom:none}
.info-icon{font-size:18px;width:28px;flex-shrink:0;text-align:center}
.info-label{font-size:12px;color:var(--muted);display:block;margin-bottom:1px}
.info-val{color:var(--dark);font-weight:400}
.info-val a{color:var(--gold);text-decoration:none}
.info-val a:hover{text-decoration:underline}
.spinner{width:24px;height:24px;border:2px solid rgba(184,149,90,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:4rem;color:var(--muted)}
.msg-err{padding:1rem;background:#fdf2f2;color:#8a2020;border:1px solid #e8c0c0;border-radius:8px;text-align:center;max-width:480px;margin:2rem auto}
.footer{text-align:center;padding:2rem;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:2rem}
.footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<nav class="nav">
  <div class="logo">Pre<span>Meny</span></div>
  <span style="font-size:13px;color:var(--muted)" id="navRest"></span>
</nav>

<div id="loadingState" class="loading"><span class="spinner"></span></div>
<div id="errorState" style="display:none" class="msg-err"></div>

<div id="mainContent" style="display:none">
  <div class="hero">
    <div id="logoWrap"></div>
    <h1 id="restTitle"></h1>
    <div class="gold-line"></div>
    <p class="tagline" id="restTagline">Förbeställ din mat inför ert sällskap – enkelt, snabbt och utan krångel.</p>

    <div class="info-card" id="infoCard" style="display:none">
      <div class="card-label" style="font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem">Kontakt & info</div>
      <div id="infoRows"></div>
    </div>

    <div style="margin-top:1.5rem;padding:1.5rem;background:rgba(184,149,90,.07);border:1px solid rgba(184,149,90,.2);border-radius:12px;max-width:480px;margin-left:auto;margin-right:auto">
      <p style="font-size:15px;color:var(--text);margin-bottom:.75rem;line-height:1.6">Har du fått en länk för att förbeställa mat? Öppna den länken direkt.</p>
      <p style="font-size:13px;color:var(--muted);line-height:1.6">Kontakta <span id="contactRestName" style="font-weight:500"></span> om du inte har din länk.</p>
    </div>
  </div>
</div>

<div class="footer">
  <a href="/">premeny.se</a> – Förbeställning av mat gjord enkel
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SURL='https://gndzalmkbsfhclpoidqi.supabase.co';
const SKEY='sb_publishable_-k5es8L7H2z0K7ipe13meA_IQxopBtY';
const {createClient}=supabase;
const db=createClient(SURL,SKEY);

const params=new URLSearchParams(location.search);
const SLUG=params.get('r')||location.pathname.split('/').filter(Boolean)[0];

async function init(){
  if(!SLUG){
    // No slug - show generic page
    document.getElementById('loadingState').style.display='none';
    document.getElementById('mainContent').style.display='block';
    document.getElementById('restTitle').textContent='Välkommen till PreMeny';
    document.getElementById('logoWrap').innerHTML='<div class="rest-logo-placeholder">P</div>';
    document.getElementById('restTagline').textContent='Förbeställ din mat inför ert sällskap – enkelt, snabbt och utan krångel.';
    return;
  }
  try{
    const {data:rest,error}=await db.from('restaurants').select('*').eq('slug',SLUG).eq('active',true).single();
    if(error||!rest){showError('Restaurangen hittades inte.');return;}

    document.documentElement.style.setProperty('--gold',rest.accent_color||'#b8955a');
    document.title=rest.name+' – PreMeny';
    document.getElementById('navRest').textContent=rest.name;
    document.getElementById('restTitle').textContent=rest.name;
    document.getElementById('contactRestName').textContent=rest.name;

    // Logo
    if(rest.logo_url){
      document.getElementById('logoWrap').innerHTML=`<img src="${rest.logo_url}" class="rest-logo" alt="${rest.name}">`;
    } else {
      document.getElementById('logoWrap').innerHTML=`<div class="rest-logo-placeholder">${rest.name[0]}</div>`;
    }

    // Contact info
    const rows=[];
    if(rest.address)rows.push(`<div class="info-row"><div class="info-icon">📍</div><div><span class="info-label">Adress</span><span class="info-val">${rest.address}</span></div></div>`);
    if(rest.phone)rows.push(`<div class="info-row"><div class="info-icon">📞</div><div><span class="info-label">Telefon</span><span class="info-val"><a href="tel:${rest.phone}">${rest.phone}</a></span></div></div>`);
    if(rest.contact_email)rows.push(`<div class="info-row"><div class="info-icon">✉</div><div><span class="info-label">E-post</span><span class="info-val"><a href="mailto:${rest.contact_email}">${rest.contact_email}</a></span></div></div>`);
    if(rest.website)rows.push(`<div class="info-row"><div class="info-icon">🌐</div><div><span class="info-label">Webbplats</span><span class="info-val"><a href="${rest.website.startsWith('http')?rest.website:'https://'+rest.website}" target="_blank">${rest.website}</a></span></div></div>`);
    if(rows.length){
      document.getElementById('infoRows').innerHTML=rows.join('');
      document.getElementById('infoCard').style.display='block';
    }

    document.getElementById('loadingState').style.display='none';
    document.getElementById('mainContent').style.display='block';
  }catch(err){showError('Något gick fel: '+err.message);}
}

function showError(msg){
  document.getElementById('loadingState').style.display='none';
  const el=document.getElementById('errorState');
  el.style.display='block';el.textContent=msg;
}

init();
</script>
</body>
</html>
